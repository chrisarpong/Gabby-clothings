name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run build
        run: npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_dummy_key_for_ci
          VITE_CONVEX_URL: https://example.convex.cloud
          VITE_PAYSTACK_PUBLIC_KEY: pk_test_dummy_key_for_ci

